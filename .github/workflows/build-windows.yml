# Builds Pulse for Windows on GitHub's Windows runners and uploads the
# installer (.exe) as an artifact. Trigger: push a tag like v0.1.0, or run
# manually (Actions -> "Build Windows exe" -> Run workflow).
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Push a tag:  git tag v0.1.0 && git push origin v0.1.0
#   3. Actions -> workflow run -> artifact "pulse-windows" contains the .exe.
name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build Pulse (frontend + Rust + bundles)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pulse ${{ github.ref_name }}"
          releaseBody: "See FEATURES.md for what's included."
          releaseDraft: true
          prerelease: false
          # Explicit Windows bundles — never try AppImage/other platforms here.
          args: --bundles msi nsis
