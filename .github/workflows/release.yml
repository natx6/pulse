name: Build installers

# Builds Windows (.exe/.msi), macOS (.dmg, Apple Silicon) and Linux (AppImage/.deb)
# installers. Intel (x64) macOS is intentionally not built: GitHub retired the
# macos-13 Intel runners (Dec 2025) and their replacement has the same fate.
# Trigger manually from the Actions tab and download the installers from the
# run's artifacts; or push a tag like v0.2.0 to also create a draft GitHub
# Release with everything attached.
#
# Auto-update: when the TAURI_SIGNING_PRIVATE_KEY secret is set, builds also
# produce signed updater artifacts (`.sig` files) and the release job assembles
# `latest.json` — the manifest the installed app polls on launch. Publish the
# draft release to roll the update out to every installed copy.
#
# The tauri CLI downloads WiX/NSIS/linuxdeploy from GitHub release endpoints
# while bundling; those downloads occasionally drop ("io: Peer disconnected").
# The build step retries — retries reuse the same runner, so the compiled
# binary and any already-downloaded tools are cached and bundling just reruns.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed so the runner's GITHUB_TOKEN can create the draft release and attach
# installers (default token is read-only in this repo).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi,nsis
          - platform: ubuntu-22.04
            bundles: appimage,deb
          # 'app' is what produces the signed .app.tar.gz the updater needs on
          # macOS ('dmg' alone is not an updater target — the build warns about it).
          - platform: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    env:
      # createUpdaterArtifacts is on permanently in tauri.conf.json, so every
      # release build produces signed updater artifacts (.sig files) as long as
      # the signing key is present in the repo secrets. If the secret is ever
      # missing, the build fails loudly instead of silently shipping unsigned
      # installers.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build installers (retries on flaky tool downloads)
        shell: bash
        run: |
          set +e
          for i in 1 2 3 4; do
            echo "::group::tauri build attempt $i"
            npm run tauri build -- --bundles ${{ matrix.bundles }}
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "attempt $i failed (exit $rc) — retrying"
            sleep 5
          done
          echo "All 4 attempts failed"
          exit 1

      - name: Upload installers + update signatures
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # One plain glob per line — @actions/glob does NOT support {..} braces.
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/dmg/*.sig
            src-tauri/target/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.sig
            # macOS updater bundle only — NOT deb internals (control/data.tar.gz)
            src-tauri/target/release/bundle/macos/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # latest.json is what installed apps poll. Each .sig file produced by the
      # signed build becomes one platform entry; the URL points at the matching
      # installer attached to this same release.
      - name: Assemble update manifest (latest.json)
        run: |
          python3 - <<'PY'
          import json, os, datetime

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          base_url = f"https://github.com/natx6/pulse/releases/download/{tag}"

          def platform_key(name):
              n = name.lower()
              if "x64-setup.exe" in n or "x86_64-setup" in n:
                  return "windows-x86_64"
              if "x64.app.tar.gz" in n:
                  return "darwin-x86_64"
              # Tauri names the macOS updater bundle just "Pulse.app.tar.gz" (no
              # arch). macos-latest is Apple Silicon, so map it to darwin-aarch64.
              if ".app.tar.gz" in n:
                  return "darwin-aarch64"
              if "aarch64" in n or "arm64" in n:
                  if "appimage" in n:
                      return "linux-arm64"
                  return "darwin-aarch64"
              if "amd64.appimage" in n or "x86_64.appimage" in n:
                  return "linux-x86_64"
              if "i686" in n:
                  return "linux-i686"
              return None

          platforms = {}
          for dirpath, _, files in os.walk("artifacts"):
              for f in sorted(files):
                  if not f.endswith(".sig"):
                      continue
                  target = f[:-4]
                  key = platform_key(f)
                  if not key:
                      print(f"WARN: no platform mapping for {f}")
                      continue
                  with open(os.path.join(dirpath, f)) as fh:
                      sig = fh.read().strip()
                  platforms[key] = {
                      "signature": sig,
                      "url": f"{base_url}/{target}",
                  }

          if not platforms:
              print("No updater signatures found — skipping latest.json")
              raise SystemExit(0)

          manifest = {
              "version": version,
              "notes": f"Pulse v{version} — auto-built installers.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(open("latest.json").read())
          PY

      - name: Draft release (tag pushes only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # The updater compares manifest version to the built binary — a tag
          # that doesn't match the conf would break updates silently.
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != tauri.conf version v${VERSION} — bump the conf or retag"
            exit 1
          fi
          ASSETS=$(find artifacts -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.tar.gz' \))
          if [ -f latest.json ]; then
            ASSETS="$ASSETS latest.json"
          fi
          gh release create "v${VERSION}" --draft --title "Pulse v${VERSION}" \
            --notes "Auto-built installers for testing. Publish this release to roll the update out." \
            $ASSETS
