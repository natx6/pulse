name: Build installers

# Builds Windows (.exe/.msi), macOS (.dmg) and Linux (AppImage/.deb/.rpm)
# installers. Trigger manually from the Actions tab, or push a tag like v0.2.0
# to also create a draft GitHub Release with the installers attached — friends
# can grab the .exe from the release page or the run's artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed so the runner's GITHUB_TOKEN can create the draft release and attach
# installers (default token is read-only in this repo).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Pulse v__VERSION__"
          releaseBody: "Auto-built installers. See the run artifacts if no release page appears."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
