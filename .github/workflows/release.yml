name: Build installers

# Builds Windows (.exe/.msi), macOS (.dmg) and Linux (AppImage/.deb) installers.
# Trigger manually from the Actions tab and download the installers from the
# run's artifacts; or push a tag like v0.2.0 to also create a draft GitHub
# Release with everything attached.
#
# The tauri CLI downloads WiX/NSIS/linuxdeploy from GitHub release endpoints
# while bundling; those downloads occasionally drop ("io: Peer disconnected").
# The build step retries — retries reuse the same runner, so the compiled
# binary and any already-downloaded tools are cached and bundling just reruns.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed so the runner's GITHUB_TOKEN can create the draft release and attach
# installers (default token is read-only in this repo).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi,nsis
          - platform: ubuntu-22.04
            bundles: appimage,deb
          - platform: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build installers (retries on flaky tool downloads)
        shell: bash
        run: |
          set +e
          for i in 1 2 3 4; do
            echo "::group::tauri build attempt $i"
            npm run tauri build -- --bundles ${{ matrix.bundles }}
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "attempt $i failed (exit $rc) — retrying"
            sleep 5
          done
          echo "All 4 attempts failed"
          exit 1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**/*.{msi,exe,dmg,AppImage,deb,rpm}
          if-no-files-found: error

      - name: Draft release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          FILES=$(find src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))
          gh release create "v${VERSION}" --draft --title "Pulse v${VERSION}" \
            --notes "Auto-built installers for testing." $FILES
