[package]
name = "pulse"
version = "0.4.9"
description = "Pulse Pharmacy Management System"
edition = "2021"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Vendored + patched: keys the sqlx pool with the SQLCipher database key.
# Do not bump to a crates.io version — see vendor/README.md.
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
calamine = "0.26"
csv = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls-manual-roots-no-provider"], default-features = false }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"

# SQLCipher (AES-256 encryption at rest). The feature unifies across
# libsqlite3-sys, so the plugin's sqlx build is SQLCipher-enabled too.
# Crypto provider: system OpenSSL via pkg-config on Unix (GH runners ship it);
# vendored OpenSSL on Windows, which has no system-wide OpenSSL.
[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher", "backup"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
